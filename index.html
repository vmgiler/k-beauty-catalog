<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Cosméticos K-Beauty</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="header-container">
            <div class="logo">K-BEAUTY STORE</div>
            <button class="cart-btn" onclick="toggleCart()">
                🛒 Carrito <span class="cart-badge" id="cart-count">0</span>
            </button>
        </div>
    </header>

    <div class="categories">
        <button class="cat-btn active" data-category="all" onclick="filterCategory('all', this)">Todos</button>
        <button class="cat-btn" data-category="lips" onclick="filterCategory('lips', this)">Labiales</button>
        <button class="cat-btn" data-category="mascarillas" onclick="filterCategory('mascarillas', this)">Mascarillas</button>
        <button class="cat-btn" data-category="serums" onclick="filterCategory('serums', this)">Serums y Limpieza</button>
        <button class="cat-btn" data-category="solar" onclick="filterCategory('solar', this)">Protección Solar</button>
    </div>

    <main class="container">
        <div class="grid" id="product-grid">
            <!-- Productos renderizados por JS -->
        </div>
    </main>

    <div class="image-modal" id="image-modal" onclick="closeImageModal(event)">
        <button class="image-modal-close" type="button" aria-label="Cerrar imagen" onclick="closeImageModal()">&times;</button>
        <div class="image-modal-content" onclick="event.stopPropagation()">
            <div class="image-modal-stage" onclick="closeImageModal(event)" onwheel="handleImageWheel(event)">
                <img class="image-modal-preview" id="image-modal-preview" alt="" onclick="handlePreviewClick()" onpointerdown="startImagePan(event)" onpointermove="moveImagePan(event)" onpointerup="endImagePan(event)" onpointercancel="endImagePan(event)">
            </div>
            <div class="image-modal-actions">
                <button class="image-modal-btn" type="button" aria-label="Alejar" onclick="zoomImage(-0.2)">-</button>
                <button class="image-modal-btn" id="image-zoom-level" type="button" aria-label="Restablecer zoom" onclick="resetImageZoom()">100%</button>
                <button class="image-modal-btn" type="button" aria-label="Acercar" onclick="zoomImage(0.2)">+</button>
            </div>
        </div>
    </div>

    <div class="modal" id="cart-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Tu Pedido</h3>
                <button class="close-btn" onclick="toggleCart()">&times;</button>
            </div>
            <div class="cart-items" id="cart-items">
                <!-- Ítems del carrito -->
            </div>
            <div class="modal-footer">
                <div class="total-row">
                    <span>Total:</span>
                    <span id="cart-total">$0.00</span>
                </div>
                <button class="print-btn" id="print-btn" onclick="printCart()" disabled>
                    🖨️ Imprimir resumen
                </button>
            </div>
        </div>
    </div>

    <section class="print-summary" id="print-summary" aria-hidden="true"></section>
    <script src="products.js"></script>
    <script src="app.js"></script>
</body>
</html>
